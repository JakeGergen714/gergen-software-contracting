services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: client_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: dev-file
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export:/opt/keycloak/data/import
      - keycloakdata:/opt/keycloak/data
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/client-portal/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 60

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/client_portal
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/client-portal
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DISABLE_AUTH: "true"
    depends_on:
      - postgres
      - keycloak
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: rebuild
          path: ./backend/pom.xml
        - action: rebuild
          path: ./backend/src

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      # Ensure reliable file watching/HMR inside Docker
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_KEYCLOAK_URL: http://localhost:8081
      VITE_KEYCLOAK_REALM: client-portal
      VITE_KEYCLOAK_CLIENT_ID: client-portal-web
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: ["npm","run","dev","--","--host","0.0.0.0"]
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
            - .vite/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  pgdata:
  keycloakdata:
